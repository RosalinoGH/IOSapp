<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rosalino: Baby Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #fdf2f8;
    color: #1f2937;
    text-align: center;
    padding: 24px;
  }
  .card { max-width: 380px; }
  h1 { font-size: 19px; margin-bottom: 8px; }
  p { font-size: 15px; color: #4b5563; line-height: 1.55; margin-bottom: 22px; }
  a.button {
    display: inline-block;
    background: #111827;
    color: #fff;
    text-decoration: none;
    padding: 14px 32px;
    border-radius: 999px;
    font-size: 16px;
    font-weight: 600;
    width: 100%;
  }
  .steps {
    display: none;
    margin-top: 22px;
    font-size: 13px;
    color: #6b7280;
    text-align: left;
    background: #fff;
    padding: 14px 16px;
    border-radius: 10px;
    line-height: 1.6;
  }
  .steps.show { display: block; }
</style>
</head>
<body>
  <div class="card">
    <h1>Rosalino: Baby Tracker</h1>
    <p id="status-text">Tap below to open the App Store.</p>

    <!-- Real, explicit tap — no auto-redirect. This is what actually works inside in-app browsers. -->
    <a class="button" id="store-link" href="https://apps.apple.com/ca/app/rosalino-baby-tracker/id6788104019">
      Open in App Store
    </a>

    <div class="steps" id="ig-steps">
      <strong>If nothing happens:</strong><br>
      Tap the <strong>•••</strong> menu in the top-right corner and choose <strong>“Open in external browser”</strong> (or “Open in Safari”), then tap the button above again.
    </div>
  </div>

  <script>
    var ua = navigator.userAgent || "";
    var isInApp = /(Instagram|FBAN|FBAV|FB_IAB|musical_ly|BytedanceWebview|Line\/|Snapchat)/i.test(ua);

    if (isInApp) {
      document.getElementById("ig-steps").classList.add("show");
    } else {
      // Real browser (Safari/Chrome/etc.) — go ahead and auto-redirect, no tap needed
      window.location.replace("https://apps.apple.com/ca/app/rosalino-baby-tracker/id6788104019");
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rosalino: Baby Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #ffffff;
    color: #1f2937;
    text-align: center;
    padding: 24px;
  }
  .card { max-width: 380px; }
  .logo {
    width: 120px;
    height: 120px;
    border-radius: 24px;
    margin-bottom: 16px;
    display: block;
    margin-left: auto;
    margin-right: auto;
  }
  h1 { font-size: 19px; margin-bottom: 8px; }
  p { font-size: 15px; color: #4b5563; line-height: 1.55; margin-bottom: 22px; }
  a.button {
    display: inline-block;
    background: #111827;
    color: #fff;
    text-decoration: none;
    padding: 14px 32px;
    border-radius: 999px;
    font-size: 16px;
    font-weight: 600;
    width: 100%;
    margin-bottom: 12px;
  }
  .steps {
    display: none;
    margin-top: 22px;
    font-size: 13px;
    color: #6b7280;
    text-align: left;
    background: #fff;
    padding: 14px 16px;
    border-radius: 10px;
    line-height: 1.6;
  }
  .steps.show { display: block; }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="ROSALINO-ICON.jpg" alt="Rosalino Logo">
    <h1>Rosalino: Baby Tracker</h1>
    <p id="status-text">Tap below to open the App Store.</p>

    <a class="button" id="store-link" href="https://apps.apple.com/ca/app/rosalino-baby-tracker/id6788104019">
      Open in App Store
    </a>
    <a class="button" id="tiktok-link" href="https://www.tiktok.com/@rosalino.babytracker">
      Open in TikTok
    </a>

    <div class="steps" id="ig-steps">
      <strong>If nothing happens:</strong><br>
      Tap the <strong>•••</strong> menu in the top-right corner and choose <strong>"Open in external browser"</strong> (or "Open in Safari"), then tap the button above again.
    </div>
  </div>

  <script>
    // No automatic redirect — user must tap the button
  </script>
</body>
</html>
